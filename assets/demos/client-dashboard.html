/* The ground and the gutter are plain CSS so the first frame, before
   Tailwind compiles, is already the canvas's navy and the text its color. */
html { color-scheme: dark; background: #0c111e; height: 100%; }
/* The publish skeleton sets :root { color-scheme: light }, which outranks
   html's: a native control would then draw light (R27.10). */
:root { color-scheme: dark; }
select option, select optgroup { background-color: #111827; color: #f8fafc; }
body { background: #0c111e; color: #f8fafc; height: 100%; margin: 0; font-family: "Work Sans", system-ui, sans-serif; overflow: hidden; }
/* The band above the sticky tool header, under a phone's status bar. */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #0c111e; }
/* The side gutter, on every band's inner edge, clear of a side system bar. */
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .gutter { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
/* Pages other than Tasks end their content column in a thin line that runs the full height, so short pages don't drop off. */
#records { min-height: 100%; }
.pagecol { min-height: 100%; box-sizing: border-box; }
@media (min-width: 900px) { .pagecol { width: max-content; max-width: 100%; border-right: 1px solid rgba(255,255,255,.10); } }
#tool-header { position: sticky; top: env(safe-area-inset-top, 0px); }
/* Refresh icon: a steady spin while Slack answers, then one last turn that eases to a stop at the same speed it was going. */
@keyframes rf-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.rf-spin { animation: rf-turn 1s linear infinite; transform-origin: 50% 50%; }
@media (prefers-reduced-motion: reduce) { .rf-spin { animation: none; } }
</style>

@layer base {

  body {

    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    transition:
      background 0.2s ease,
      color 0.2s ease;
  }

  h1,
  h2,
  h3 {
    font-family: var(--font-sans);

  ::selection {
    background: var(--sand-sub);

  const emit = (p) => { const docs = [...col(p).entries()].map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) })); (listeners.get(p) || new Set()).forEach((cb) => setTimeout(() => cb({ docs }), 0)); };
  const split = (p) => { const i = p.lastIndexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; };
  const db = {
    collection: (p) => ({
      onSnapshot(cb) { if (!listeners.has(p)) listeners.set(p, new Set()); listeners.get(p).add(cb); emit(p); return () => listeners.get(p).delete(cb); },

      async set(data) { put(p, id, data); emit(p); },
      async update(patch) { put(p, id, { ...(col(p).get(id) || {}), ...patch }); emit(p); },
      async delete() { col(p).delete(id); emit(p); },
    }; },
  };

    async invalidate() { pushLists(); },

      await wait(300);
      if (tool === "slack_update_list_record") {
        const r = rows[args.list_id].find((x) => x["Record ID"] === args.record_id);

      if (tool === "read_file_content") { await wait(400); return { payload: { fileContent: `Weekly standup, ${slash(-1)}\n\nSummary\nThe team reviewed both lists. Job history is loading, with duplicate job numbers in 2023 to sort out. The estimating exports from Ridgeline are now overdue. Owen asked whether the WIP report can go out every Monday.\n\nNext steps\n- Priya: send the WIP report every Monday starting next week\n- Marco: fix the duplicate 2023 job numbers before loading the rest\n- Theo: ask Kate again for the estimating exports, by Friday\n- Lena: book a call with Owen on the activity codes\n- Martha: order lunch for the training day` } }; }
      return { payload: {} };
    },
  };

  const user = { async can() { return true; }, async me() { return { name: "Martha", email: "" }; } };
  return { use: async (name) => ({ db, mcp, user, sample })[name] || null };
})();

function parseCSV(text) {

    else if (c === '"') q = true;

/* The refresh button spins until both lists come back from Slack (at least 0.8 s, so the spin is seen), then says when.

function spinStop(done) {

  if (!s || !a) { s?.classList.remove("rf-spin"); return done(); }
  const from = ((Number(a.currentTime) || 0) % 1000) / 1000 * 360;   // the steady spin is 360° per second
  let d = 180 - (from % 180); if (d < 60) d += 180;                   // to the next upright, at least 60° away

/* =====================================================================

   gate everything waits on, what the client owes per stage, and fixed dates.
   Weeks become dates once the client record has a kickoff date.

function weeksOf(s) { const m = (s || "").match(/(\d+)\s*(?:[–-]|to)\s*(\d+)/); return m ? [+m[1], +m[2]] : null; }
function renderTimeline() {

  const gate = tl.gate ? rowShell(`<p class="flex items-center gap-1.5 text-[14px] font-medium text-text">${icon("lucide:ShieldCheck", `h-4 w-4 ${gateDone ? "c-done" : "c-waiting"}`)}${esc(tl.gate.label || "Gate")}</p>`, gateDone ? "Done. The stages can start." : gateConflict ? "Marked complete in Slack, but the status still says in progress. Confirm it's signed off." : "Everything below waits on this.",
    `<div data-stagebar class="absolute inset-y-1 left-0 flex items-center gap-2 rounded-lg border border-white/[0.16] bg-white/[0.04] px-3 text-[12px] text-text-2" style="width:${wid(1, 1)};min-width:9rem">${gateDone ? icon("lucide:Check", "h-3.5 w-3.5 c-done") : icon(gateConflict ? "lucide:TriangleAlert" : "lucide:Clock", "h-3.5 w-3.5 c-problem")}${gateDone ? "Signed off" : gateConflict ? "Check status" : "Before week 1"}</div>`) : "";

    <div class="relative"><div class="grid grid-cols-[16rem_minmax(0,1fr)] gap-4 border-b border-white/[0.13] pb-2 max-[700px]:hidden"><span class="text-[12px] text-text-3">Stage</span><div class="grid" style="grid-template-columns:repeat(${total},minmax(0,1fr))">${axis}</div></div>
    ${gate}${rows}${today}</div>
    ${ms.length ? `<section aria-label="Fixed dates" class="mt-8"><h4 class="text-[15px] font-semibold text-text">Fixed dates</h4>${msHtml}</section>` : ""}

/* =====================================================================
   16b. PROGRESS: charts built from the saved standups. Each Finish standup

const PG = { tables: new Set(), gid: 0 };
const pgFmt = (n) => (Math.round(n * 10) / 10).toString();
const pgWeek = (c, at) => Math.max(0, Math.round(daysBetween(c.timeline?.kickoff || at, at) / 7));
const pgWhen = (c, p) => p.now ? "Now" : `Week ${pgWeek(c, p.at)}`;
const pgId = (p) => `${p}${++PG.gid}`;
const PG_KEYS = ["open", "overdue", "slipped", "owed", "scope", "done"];

const pgKeys = (c) => (c.lists || []).map((L) => L.key).filter((k) => S.list === "all" || k === S.list);

/* A soft top-to-bottom fade under a line, in the line's own color. */
const pgFade = (id, color, top) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="${top}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>`;
const PANEL = `rounded-xl border border-white/[0.08] p-4" style="background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 72%)`;
function pgSpark(vals, w = 96, h = 28) {
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0), sx = (i) => 2 + (i / Math.max(1, vals.length - 1)) * (w - 6), sy = (v) => h - 3 - ((v - min) / (max - min || 1)) * (h - 8);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${sx(i).toFixed(1)} ${sy(v).toFixed(1)}`).join(" "), li = vals.length - 1, id = pgId("sp");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" class="block"><defs>${pgFade(id, "var(--text)", 0.2)}</defs>
    <path d="${d} L${sx(li).toFixed(1)} ${h} L${sx(0).toFixed(1)} ${h} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="var(--text-3)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${sx(li)}" cy="${sy(vals[li])}" r="3" fill="var(--text)"/></svg>`;
}
function pgTile(label, value, sub, vals, flag) {

    <p class="flex items-center gap-1.5 text-[13px] text-text-2">${flag ? icon("lucide:Clock", "h-3.5 w-3.5 c-problem") : ""}${label}</p>
    <div class="flex items-end justify-between gap-3"><p class="whitespace-nowrap text-[30px] font-semibold leading-none tabular-nums text-text">${value}</p><div class="max-[520px]:hidden">${pgSpark(vals)}</div></div>
    <p class="text-[12px] text-text-3">${sub}</p></div>`;
}
const pgDelta = (a, b) => { const d = a - b; return d === 0 ? "Same as the last standup" : `${d > 0 ? "+" : "−"}${Math.abs(d)} since the last standup`; };
function pgSection(id, title, lead, chart, table) {
  const on = PG.tables.has(id);
  return `<section aria-label="${esc(title)}" class="flex flex-col gap-3 border-t border-border-sub pt-5">
    <div class="flex flex-wrap items-start justify-between gap-2"><div class="min-w-0"><h3 class="text-[16px] font-semibold text-text">${esc(title)}</h3><p class="mt-1 max-w-[42rem] text-[14px] text-text-2">${lead}</p></div>
    <button type="button" data-pg-table="${id}" aria-expanded="${on}" class="${CHIP} ${chipOff}">${icon("lucide:Rows3", "h-4 w-4 text-text-2")}${on ? "Show the chart" : "Show the numbers"}</button></div>

const pgTable = (head, rows) => `<table class="w-full min-w-[28rem] text-left text-[13px] tabular-nums"><thead><tr class="border-b border-white/[0.13] text-text-3">${head.map((h) => `<th class="py-2 pr-4 font-medium">${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr class="border-b border-white/[0.08]">${r.map((x) => `<td class="py-2 pr-4 text-text">${x}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

function pgBurnup(c, pts, W) {
  const tl = c.timeline || {}, kick = tl.kickoff, weeks = tl.weeks || 12;
  const H = W < 600 ? 240 : 280, L = 34, R = W < 600 ? 84 : 130, T = 22, B = 34, iw = W - L - R, ih = H - T - B;
  const xw = (at) => daysBetween(kick, at) / 7;
  const P = [{ at: kick, scope: pts[0].scope, done: 0 }, ...pts];
  const last = P[P.length - 1], elapsed = Math.max(0.5, xw(last.at));
  const ymax = Math.max(...P.map((p) => p.scope)) + 1, gstep = ymax > 24 ? 8 : 4;
  const X = (w) => L + (w / weeks) * iw, Y = (v) => T + ih - (v / ymax) * ih;
  const pace = last.done / elapsed, proj = Math.min(last.scope, last.done + pace * (weeks - elapsed)), left = Math.round(last.scope - proj);
  const step = P.map((p, i) => `${i ? `L${X(xw(p.at)).toFixed(1)} ${Y(P[i - 1].scope).toFixed(1)} ` : "M"}${X(xw(p.at)).toFixed(1)} ${Y(p.scope).toFixed(1)}`).join(" ");
  const done = P.map((p, i) => `${i ? "L" : "M"}${X(xw(p.at)).toFixed(1)} ${Y(p.done).toFixed(1)}`).join(" ");
  const nx = X(elapsed), base = Y(0), gS = pgId("bs"), gD = pgId("bd");
  const grid = Array.from({ length: Math.floor((ymax - 1) / gstep) + 1 }, (_, i) => i * gstep).map((v) => `<line x1="${L}" x2="${L + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--text-3)" stroke-opacity=".16"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${v}</text>`).join("");
  const ticks = Array.from({ length: weeks / (W < 600 ? 4 : 2) + 1 }, (_, i) => i * (W < 600 ? 4 : 2)).map((w) => `<text x="${X(w)}" y="${H - 10}" text-anchor="${w === 0 ? "start" : w === weeks ? "end" : "middle"}" font-size="11" fill="var(--text-3)">${w === 0 ? "Kickoff" : `Week ${w}`}</text>`).join("");
  const dots = P.slice(1).map((p) => `<circle cx="${X(xw(p.at))}" cy="${Y(p.done)}" r="${p.now ? 5 : 3.5}" fill="var(--c-done)" stroke="var(--surface-context)" stroke-width="2"><title>${p.now ? "Now" : `Week ${Math.round(xw(p.at))}`}: ${p.done} of ${p.scope} done</title></circle>`).join("");
  const labelY = Math.min(Y(proj) + 4, T + ih - 44), scopeY = Math.min(Y(last.scope) + 4, labelY - 18);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Burn-up. ${last.done} of ${last.scope} tasks done in week ${Math.floor(elapsed) + 1} of ${weeks}. At this pace about ${left} tasks would still be open at week ${weeks}." class="block max-w-full">
    <defs>${pgFade(gS, "var(--text)", 0.09)}${pgFade(gD, "var(--c-done)", 0.3)}</defs>
    ${grid}${ticks}
    <path d="${step} L${nx.toFixed(1)} ${base} L${L} ${base} Z" fill="url(#${gS})"/>
    <path d="${done} L${nx.toFixed(1)} ${base} L${L} ${base} Z" fill="url(#${gD})"/>
    <rect x="${nx}" y="${T}" width="${X(weeks) - nx}" height="${ih}" fill="var(--text-3)" fill-opacity=".05"/>
    <line x1="${nx}" x2="${nx}" y1="${T - 6}" y2="${T + ih}" stroke="var(--sand)" stroke-width="1.5"/>
    <text x="${nx + 6}" y="${T + 4}" font-size="11" font-weight="600" fill="var(--sand)">Today</text>
    <line x1="${X(weeks)}" x2="${X(weeks)}" y1="${T}" y2="${T + ih}" stroke="var(--text-2)" stroke-dasharray="2 3"/>
    <path d="${step} L${X(weeks)} ${Y(last.scope)}" fill="none" stroke="var(--text-2)" stroke-width="1.75"/>
    <path d="${done}" fill="none" stroke="var(--c-done)" stroke-width="2.25" stroke-linejoin="round"/>
    <path d="M${nx} ${Y(last.done)} L${X(weeks)} ${Y(proj)}" fill="none" stroke="var(--c-done)" stroke-width="1.75" stroke-dasharray="5 5" opacity=".8"/>
    ${dots}
    <text x="${X(weeks) + 10}" y="${scopeY}" font-size="12" fill="var(--text)" font-weight="600">Scope ${last.scope}</text>
    <text x="${X(weeks) + 10}" y="${labelY}" font-size="12" fill="var(--text)" font-weight="600">Done ${Math.round(proj)}</text>
    <text x="${X(weeks) + 10}" y="${labelY + 15}" font-size="11" fill="var(--text-2)">at this pace</text>
    <text x="${X(weeks) + 10}" y="${labelY + 29}" font-size="11" fill="var(--text-2)">${left} still open</text>
    <text x="${X(weeks) - 6}" y="${T + ih - 8}" text-anchor="end" font-size="11" fill="var(--text-2)">${W < 600 ? "Handover" : `Week ${weeks} handover`}</text>
  </svg>`;
}

/* Only projects with stages get this chart: the data project, on All or on its own. */
function pgStages(c) {

    const pct = done / n, behind = exp - pct >= 0.15, expN = Math.round(exp * n);

  });
  const chart = `<ul class="flex flex-col">${rows.map((r) => `<li class="grid grid-cols-[12rem_minmax(0,1fr)_11rem] items-center gap-4 border-b border-white/[0.08] py-3 last:border-b-0 max-[700px]:grid-cols-1 max-[700px]:gap-2">
      <div class="min-w-0">${stagePill(r.k)}<p class="mt-1 text-[12px] text-text-2">${esc(r.v.name)}</p><p class="text-[12px] tabular-nums text-text-3">${esc(r.v.weeks)}</p></div>
      <div class="relative h-6" role="img" aria-label="${esc(r.k)}: ${r.done} of ${r.n} done, plan expects ${Math.round(r.exp * 100)}% by today">
        <div class="absolute inset-y-1.5 left-0 right-0 rounded-full" style="background:linear-gradient(90deg,color-mix(in srgb,var(--text-3) 14%,transparent),color-mix(in srgb,var(--text-3) 26%,transparent))"></div>
        <div class="absolute inset-y-1.5 left-0 rounded-full" style="width:${(r.pct * 100).toFixed(1)}%;background:linear-gradient(90deg,color-mix(in srgb,var(--c-done) 50%,transparent),var(--c-done));box-shadow:0 0 12px -2px color-mix(in srgb,var(--c-done) 45%,transparent)"></div>

const monthKey = (k) => (k || "").slice(0, 7);

function doneMonth(t) {

  const i = S.snaps.findIndex((s) => s.rows?.[t.id]?.done);
  if (i < 0) return { month: monthKey(todayKey()) };
  if (i === 0) return { month: monthKey(S.snaps[0].takenAt), before: true };

function reportData(month) {

  const done = ts.map((t) => ({ t, m: doneMonth(t) })).filter((x) => x.m && x.m.month === month);
  const meetings = meetingsSorted().filter((m) => monthKey(m.id) === month);
  const decisions = meetings.flatMap((m) => (m.decisions || []).map((d) => ({ ...d, date: m.id })));
  const open = ts.filter((t) => !t.done);
  const today = todayKey();
  const comingUp = open.filter((t) => !t.overdue && (t.status === "In progress" || monthKey(t.due) === next || (t.due && monthKey(t.due) === month))).sort(taskOrder);

  return { c, month, next, done, meetings, decisions, comingUp, carried, owed, scope, stages };
}

  let done = false;
  const finish = (save) => { if (done) return; done = true; if (!(save && renameTask(t, input.value))) { renderBody(); if (S.open) renderDetails(); } };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); finish(true); } if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); } });
  input.addEventListener("blur", () => finish(true));
}

/* Row actions */
/* The status a task had before it was marked complete: from this visit, else from the last saved standup. */
function statusBefore(t) {
  const s = S.completedFrom.get(t.id) || baseSnap()?.rows?.[t.id]?.s;
  return s && s !== "Done" ? s : "In progress";
}
function toggleComplete(t) {
  if (t.archived) return;
  if (!S.placeFrom.has(t.id)) S.placeFrom.set(t.id, t.status); // the column it's in now: it stays there until you leave the tab
  if (!t.done) S.completedFrom.set(t.id, t.status);           // the status to put back if it's unchecked
  S.justCompleted.add(t.id);
  if (!t.done) saveTask(t, { Completed: true, Status: "Done" }, "Marked complete. Archive it when you're ready.");
  else { const back = statusBefore(t); saveTask(t, { Completed: false, Status: back }, `Marked not complete. Back to ${back}.`); }
}
async function archiveTask(t, undo) {
  const prev = S.archive.get(t.recordId);
  S.archive.set(t.recordId, { title: t.title }); _tasks = null; if (S.open === t.id) { S.open = null; detEl.hidden = true; } renderAll();
  try {
    await api.set(`clients/${S.clientId}/archive/${t.recordId}`, { title: t.title, list: t.list.key, archivedAt: new Date().toISOString(), by: S.me.name || "" });
    if (undo) toast(`Archived again: ${t.title}`);
    if (!undo) { pushHistory(`Archive: ${t.title}`, () => restoreTask(t, true), () => archiveTask(t, true)); toast("Archived. Find it under More › Archived.", { label: "Undo", fn: undoLast }); }
  } catch (e) { prev ? S.archive.set(t.recordId, prev) : S.archive.delete(t.recordId); _tasks = null; renderAll(); toast("The task wasn't archived. You may not have edit access."); }
}
async function restoreTask(t, undo) {
  const prev = S.archive.get(t.recordId);
  S.archive.delete(t.recordId); _tasks = null; renderAll();
  try { await api.remove(`clients/${S.clientId}/archive/${t.recordId}`); if (!undo) { pushHistory(`Restore: ${t.title}`, () => archiveTask(t, true), () => restoreTask(t, true)); toast("Restored to the list.", { label: "Undo", fn: undoLast }); } else toast(`Undid: ${t.title}`); }
  catch (e) { if (prev) S.archive.set(t.recordId, prev); _tasks = null; renderAll(); toast("The task wasn't restored. You may not have edit access."); }
}
function rowMenu(anchor, t) {
  const items = [{ value: "open", label: "Open task" }, ...(t.archived ? [{ value: "restore", label: "Restore" }] : [{ value: "rename", label: "Rename" }, { value: "complete", label: t.done ? "Mark not complete" : "Mark complete" }, { value: "archive", label: "Archive" }]), ...(t.url ? [{ value: "slack", label: "Open in Slack" }] : [])];
  openMenu(anchor, items, (v) => {
    if (v === "open") openDetails(t.id);
    else if (v === "rename") { const b = document.querySelector(`[data-row="${CSS.escape(t.id)}"] [data-open], li [data-open="${CSS.escape(t.id)}"]`); if (b) editTitle(b, t); }
    else if (v === "complete") toggleComplete(t);
    else if (v === "archive") archiveTask(t);
    else if (v === "restore") restoreTask(t);
    else if (v === "slack") window.open(t.url, "_blank", "noopener");
  }, t.archived ? "" : "Archiving hides the task here. Slack can't be archived from the dashboard, so archive it in Slack too when you're done with it.", "current");
}
function editDue(btn, t) {
  const td = btn.parentElement, input = document.createElement("input");
  input.type = "date"; input.value = t.due || ""; input.setAttribute("aria-label", `Due date for ${t.title}`);
  input.className = "h-8 w-full rounded-md border border-border-sub bg-surface-input px-2 text-[13px] text-text [color-scheme:dark]";
  td.replaceChildren(input); input.focus(); try { input.showPicker?.(); } catch (x) {}
  let done = false;
  const finish = (save) => { if (done) return; done = true; const v = input.value; if (save && v && v !== t.due) saveTask(t, { "Due date": v }, `Due date set to ${shortDay(v)}`); else renderBody(); };
  input.addEventListener("change", () => finish(true));
  input.addEventListener("blur", () => finish(true));
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); finish(false); } if (e.key === "Enter") finish(true); });
}
document.addEventListener("click", (e) => {
  let b;
  if ((b = e.target.closest("[data-complete]"))) { const t = findTask(b.dataset.complete); if (t) toggleComplete(t); return; }
  if ((b = e.target.closest("[data-set-prio]"))) { const t = findTask(b.dataset.setPrio), n = +b.dataset.n; if (t && n !== Math.min(TOOL.prioMax, t.prio)) saveTask(t, { Priority: n }, `Priority set to ${n}`); return; }
  if ((b = e.target.closest("[data-edit-assignee]"))) { const t = findTask(b.dataset.editAssignee); if (t) assigneeMenu(b, t); return; }
  if ((b = e.target.closest("[data-edit-status]"))) { const t = findTask(b.dataset.editStatus); if (t) openMenu(b, TOOL.statuses.map((s) => ({ value: s.k, label: s.k, checked: s.k === t.status })), (k) => { if (k === t.status) return; if (k === "Done") { S.justCompleted.add(t.id); S.completedFrom.set(t.id, t.status); saveTask(t, { Completed: true, Status: "Done" }, "Marked complete"); } else saveTask(t, t.completed ? { Completed: false, Status: k } : { Status: k }, `Status set to ${k}`); }); return; }
  if ((b = e.target.closest("[data-edit-due]"))) { const t = findTask(b.dataset.editDue); if (t) editDue(b, t); return; }
  if ((b = e.target.closest("[data-rename]"))) { const t = findTask(b.dataset.rename), title = b.parentElement.querySelector("[data-open]"); if (t && title) { b.remove(); editTitle(title, t); } return; }
  if ((b = e.target.closest("[data-rename-panel]"))) { const t = findTask(b.dataset.renamePanel), h = detEl.querySelector("h2"); if (t && h) editTitle(h, t, "w-full rounded-md border border-border-sub bg-surface-input px-2 py-1 text-[20px] font-semibold leading-7 text-text"); return; }
  if ((b = e.target.closest("[data-archive]"))) { const t = findTask(b.dataset.archive); if (t) archiveTask(t); return; }
  if ((b = e.target.closest("[data-restore]"))) { const t = findTask(b.dataset.restore); if (t) restoreTask(t); return; }
  if ((b = e.target.closest("[data-row-menu]"))) { const t = findTask(b.dataset.rowMenu); if (t) rowMenu(b, t); }
});
$("#records").addEventListener("contextmenu", (e) => {
  const tr = e.target.closest("tr[data-row], li:has([data-complete])"); if (!tr || e.target.closest("input")) return;
  const id = tr.dataset.row || tr.querySelector("[data-complete]")?.dataset.complete, t = id && findTask(id); if (!t) return;
  e.preventDefault(); rowMenu(tr.querySelector("[data-row-menu],[data-restore]") || tr, t);
});

/* =====================================================================
   22. MY DAY / MY WEEK: one person's view: what's late, what's due, what
   they're working on, what changed, and their open action items.
   ===================================================================== */
function myPerson() {
  if (S.myPerson) return S.myPerson;
  const first = (S.me.name || "").split(" ")[0];
  const names = [...new Set(Object.values(C()?.people || {}))];
  return names.find((n) => n.toLowerCase() === first.toLowerCase()) || names[0] || "";
}
function renderMyDay() {
  const el = $("#records"), c = C(), who = myPerson(), week = S.myMode === "week", today = todayKey(), end = addDays(today, 6);
  if (notLoaded()) { el.innerHTML = loading("Reading the Slack lists"); return; }
  const mine = listScope(allTasks()).filter((t) => t.people.includes(who) && !t.done);
  const overdue = mine.filter((t) => t.overdue).sort(taskOrder);
  const due = mine.filter((t) => !t.overdue && t.due && (week ? t.due <= end : t.due === today)).sort(taskOrder);
  const inProg = mine.filter((t) => t.status === "In progress" && !overdue.includes(t) && !due.includes(t)).sort(taskOrder);
  const changed = mine.filter((t) => t.change && !overdue.includes(t) && !due.includes(t) && !inProg.includes(t));
  const owed = mine.filter((t) => t.waiting);
  // A ticked item stays in place, crossed out, until you leave the tab, as everywhere else.
  const acts = [...S.actions.values()].filter((a) => !a.taskRef && (!a.done || S.justDone.has(a.id)) && (a.owner || "").toLowerCase().includes(who.toLowerCase()));
  const next = mine.filter((t) => t.due && t.due > (week ? end : today)).sort(taskOrder)[0];
  const block = (title, xs, detail, dot) => xs.length ? sec(title, `<ul>${xs.map((t) => myRow(t, detail ? detail(t) : "")).join("")}</ul>`, xs.length, dot ? `<span class="att-dot" aria-hidden="true"></span>` : "") : "";
  const people = [...new Set(Object.values(c.people || {}))];
  const modes = `<div role="radiogroup" aria-label="Range" data-roving="x" class="inline-flex h-11 items-center rounded-full border border-border-sub p-0.5 min-[900px]:h-8">${[["day", "My Day"], ["week", "My Week"]].map(([k, l]) => { const on = S.myMode === k; return `<button type="button" role="radio" data-mymode="${k}" data-rove aria-checked="${on}" tabindex="${on ? 0 : -1}" class="inline-flex h-full items-center rounded-full px-3 text-[13px] transition-colors ${on ? "bg-sand-sub font-semibold text-sand" : "font-medium text-text hover:bg-surface-hover"}">${l}</button>`; }).join("")}</div>`;
  const summary = [overdue.length ? `${overdue.length} overdue` : "", `${due.length} due ${week ? "this week" : "today"}`, inProg.length ? `${inProg.length} in progress` : "", acts.length ? plural(acts.length, "action item", "action items") : ""].filter(Boolean).join(" · ");
  const body = [
    block("Overdue", overdue, (t) => esc(t.notes[0]?.text || ""), true),
    block(week ? "Due this week" : "Due today", due),
    block("In progress", inProg),
    block("Changed since the last standup", changed, (t) => esc(t.change.text)),
    block(`Waiting on the client`, owed, (t) => t.waitDays ? `Waiting ${plural(t.waitDays, "day", "days")}` : ""),
    acts.length ? sec("Your action items", `<ul>${acts.map((a) => actionRow(a, true)).join("")}</ul>`, acts.filter((a) => !a.done).length || "") : "",
  ].filter(Boolean).join("");
  el.innerHTML = `<div class="gutter pagecol py-6"><div class="w-[48rem] max-w-full">
    <header class="mb-6 flex flex-wrap items-start justify-between gap-3"><div>
      <h2 class="text-[22px] font-semibold leading-7 text-text">${esc(who)}'s ${week ? "week" : "day"}</h2>
      <p class="mt-1 text-[14px] text-text-2">${esc(week ? `${longDay(today)} to ${shortDay(end)}` : longDay(today))}${S.list === "all" ? "" : ` · ${esc(projectName())}`}</p>
      <p class="mt-1 text-[13px] text-text-3">${esc(summary)}</p></div>
      <div class="flex flex-wrap items-center gap-1.5">${modes}<button type="button" id="person-btn" aria-haspopup="menu" aria-expanded="false" class="inline-flex h-11 items-center gap-1 rounded-full px-3 text-[13px] font-medium text-text transition-colors hover:bg-surface-hover min-[900px]:h-8 min-[900px]:px-2.5"><span class="text-text-2">Viewing:</span> ${esc(who)}${icon("lucide:ChevronDown", "h-3.5 w-3.5 text-text-2")}</button></div></header>
    <div class="flex flex-col gap-8">${body || `<p class="text-[15px] text-text">Nothing overdue or due ${week ? "this week" : "today"}.${next ? ` Next up: <button type="button" data-open="${esc(next.id)}" class="font-medium text-text underline decoration-text-3 underline-offset-2">${esc(next.title)}</button>, due ${esc(shortDay(next.due))}.` : ""}</p>`}</div>
    </div><div class="h-12"></div></div>`;
  $("#person-btn")?.addEventListener("click", (e) => openMenu(e.currentTarget, people.map((p) => ({ value: p, label: p, checked: p === who })), (p) => { S.myPerson = p; renderBody(); refocus("#person-btn"); }));
}
$("#records").addEventListener("click", (e) => {
  const mb = e.target.closest("#meeting-btn"); if (!mb) return;
  const items = [{ value: "next", label: "Next standup", checked: S.mSel === "next" }, ...meetingsSorted().map((m) => ({ value: m.id, label: `${m.title || "Meeting"}, ${shortDay(m.id)}`, checked: S.mSel === m.id }))];
  openMenu(mb, items, (id) => { S.mSel = id; renderBody(); refocus("#meeting-btn"); });
});
$("#records").addEventListener("click", (e) => { const b = e.target.closest("[data-mymode]"); if (!b) return; S.myMode = b.dataset.mymode; savePrefs(); renderBody(); refocus(`[data-mymode="${S.myMode}"]`); });

/* Card titles are not buttons (a button can't start a drag in Safari), so Enter and Space open them. */
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches?.('[role="button"][data-open]')) { e.preventDefault(); e.target.click(); } });

</script>
